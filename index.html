<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>juicy.js API 文件</title>
  <style>
    :root {
      --bg: #fbfaf7;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #e3e0d8;
      --accent: #c98a00;
      --accent-soft: #fff4d1;
      --code-bg: #f4f2ec;
      --tk-k: #a626a4;
      --tk-s: #2f7d32;
      --tk-c: #8a8f98;
      --tk-n: #b45309;
      --tk-f: #1f6feb;
      --tk-d: #c98a00;
      --log-bg: #1e1f22;
      --log-text: #d6d8dc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171a;
        --panel: #1d1f23;
        --text: #e6e6e6;
        --muted: #9aa0a6;
        --border: #2e3137;
        --accent: #ffcc00;
        --accent-soft: #3a3214;
        --code-bg: #24262b;
        --tk-k: #d19af0;
        --tk-s: #8fd18f;
        --tk-c: #7d838c;
        --tk-n: #f0a868;
        --tk-f: #79b8ff;
        --tk-d: #ffcc00;
        --log-bg: #0f1012;
        --log-text: #c9ccd1;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.65 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    }

    code,
    pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    a {
      color: var(--accent);
    }

    #layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      max-width: 1180px;
      margin: 0 auto;
    }

    #nav {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      padding: 24px 12px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      padding: 0 10px;
    }

    .brand span {
      color: var(--accent);
    }

    .ver {
      color: var(--muted);
      font-size: 12px;
      padding: 0 10px 10px;
    }

    .lang {
      display: inline-flex;
      margin: 0 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .lang button {
      font: inherit;
      font-size: 12px;
      padding: 3px 12px;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }

    .lang button.on {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    .toc-group {
      margin: 14px 10px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .toc-group::before {
      content: "★ ";
      color: var(--accent);
    }

    .part {
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .toc a {
      display: block;
      padding: 5px 10px;
      border-radius: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .toc a:hover {
      color: var(--text);
    }

    .toc a.active {
      background: var(--accent-soft);
      color: var(--text);
      font-weight: 600;
    }

    #main {
      padding: 32px 40px 120px;
      min-width: 0;
    }

    section {
      padding-top: 24px;
      margin-bottom: 40px;
      scroll-margin-top: 8px;
    }

    h1 {
      font-size: 40px;
      margin: 0 0 4px;
    }

    h1 span {
      color: var(--accent);
    }

    h2 {
      font-size: 26px;
      margin: 0 0 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    h3 {
      font-size: 16px;
      margin: 0;
    }

    .lead {
      color: var(--muted);
      font-size: 17px;
      margin-top: 0;
    }

    .intro {
      color: var(--muted);
    }

    .intro code,
    .api td code,
    .desc code,
    li code {
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin: 20px 0;
      padding: 0;
      list-style: none;
    }

    .features li {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .features b {
      display: block;
      margin-bottom: 2px;
    }

    .api {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: block;
      overflow-x: auto;
    }

    .api tbody {
      display: table;
      width: 100%;
    }

    .api td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .api tr:last-child td {
      border-bottom: 0;
    }

    .api td:first-child {
      white-space: nowrap;
      width: 1%;
    }

    .api td:first-child code {
      background: none;
      padding: 0;
      color: var(--tk-f);
    }

    .demo {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 16px 0;
      overflow: hidden;
    }

    .demo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .rerun {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .rerun:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .demo .reset {
      display: none;
    }

    .demo.edited .reset {
      display: inline-block;
    }

    .demo.edited h3::after {
      content: "已修改";
      margin-left: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 0 5px;
      vertical-align: 2px;
    }

    .desc {
      margin: 0;
      padding: 10px 16px 0;
      color: var(--muted);
      font-size: 14px;
    }

    pre.code {
      margin: 12px 16px;
      padding: 14px 16px;
      background: var(--code-bg);
      border-radius: 8px;
      overflow-x: auto;
      line-height: 1.55;
      position: relative;
      cursor: text;
    }

    pre.code:focus-within {
      box-shadow: 0 0 0 2px var(--accent);
    }

    pre.code>code {
      display: block;
      outline: none;
      caret-color: var(--text);
      tab-size: 2;
    }

    pre.code::after {
      content: "可編輯 · ⌘/Ctrl + Enter 執行";
      position: absolute;
      top: 6px;
      right: 10px;
      font: 11px system-ui, sans-serif;
      color: var(--muted);
      opacity: 0;
      transition: opacity .15s;
      pointer-events: none;
    }

    pre.code.no-run::after {
      content: "可編輯";
    }

    pre.code:hover::after,
    pre.code:focus-within::after {
      opacity: 1;
    }

    .tk-k {
      color: var(--tk-k);
    }

    .tk-s {
      color: var(--tk-s);
    }

    .tk-c {
      color: var(--tk-c);
      font-style: italic;
    }

    .tk-n {
      color: var(--tk-n);
    }

    .tk-f {
      color: var(--tk-f);
    }

    .tk-d {
      color: var(--tk-d);
      font-weight: 700;
    }

    .result {
      margin: 0 16px 12px;
      padding: 14px 16px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      position: relative;
    }

    .result::before {
      content: "結果";
      position: absolute;
      top: -9px;
      left: 10px;
      background: var(--panel);
      padding: 0 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .result:empty {
      display: none;
    }

    :root[lang=en] .result::before {
      content: "Result";
    }

    :root[lang=en] .demo.edited h3::after {
      content: "edited";
    }

    :root[lang=en] pre.code::after {
      content: "Editable · ⌘/Ctrl + Enter to run";
    }

    :root[lang=en] pre.code.no-run::after {
      content: "Editable";
    }

    .log {
      margin: 0 16px 16px;
      padding: 10px 14px;
      background: var(--log-bg);
      color: var(--log-text);
      border-radius: 8px;
      font: 12.5px/1.6 ui-monospace, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log::before {
      content: "console";
      display: block;
      color: #7d838c;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .log:empty {
      display: none;
    }

    /* 範例用樣式 */
    .result button {
      font: inherit;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    .result input:not([type]),
    .result input[type=number],
    .result textarea,
    .result select {
      font: inherit;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      max-width: 100%;
    }

    .result p {
      margin: 6px 0;
    }

    .result pre {
      background: var(--code-bg);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0 0;
    }

    .tag {
      display: inline-block;
      padding: 2px 10px;
      margin: 0 6px 6px 0;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .tag.blue {
      background: #1f6feb;
      color: #fff;
      border-color: #1f6feb;
    }

    .tag.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .tag.error {
      background: crimson;
      color: #fff;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
      flex-wrap: wrap;
    }

    .row>span:first-child {
      width: 48px;
      color: var(--muted);
      font-size: 13px;
    }

    .addr {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    .addr button {
      padding: 0 10px;
    }

    .addr code {
      flex: 1;
      padding: 2px 8px;
      color: var(--muted);
    }

    .result nav.tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .result nav.tabs a {
      padding: 3px 12px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .result nav.tabs a.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      margin: 6px 0;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .user-card .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }

    .user-card>div {
      flex: 1;
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }

    .user-card small {
      color: var(--muted);
    }

    .user-card button.on {
      border-color: var(--accent);
      color: var(--accent);
    }

    .stars i {
      cursor: pointer;
      font-style: normal;
      font-size: 20px;
      color: var(--accent);
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: 8px 0;
      overflow: hidden;
    }

    .panel>header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: var(--code-bg);
      font-weight: 600;
    }

    .panel>header button {
      padding: 0 8px;
    }

    .panel>.body {
      padding: 8px 12px;
    }

    .panel.warn>header {
      background: #f5c04a;
      color: #000;
    }

    .skeleton {
      display: block;
      height: 48px;
      margin: 6px 0;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--code-bg), var(--border), var(--code-bg));
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.3s, transform 0.3s;
    }

    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
      transform: translateY(-6px);
    }

    .slide-enter-active,
    .slide-leave-active {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .slide-enter-from {
      opacity: 0;
      transform: translateX(-24px);
    }

    .slide-leave-to {
      opacity: 0;
      transform: translateX(24px);
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-enter-active,
      .fade-leave-active,
      .slide-enter-active,
      .slide-leave-active {
        transition: none;
      }
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.45);
    }

    .modal-box {
      min-width: 260px;
      max-width: calc(100vw - 32px);
      padding: 20px;
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .modal-box h3 {
      margin-bottom: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .layout aside a {
      display: block;
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
    }

    .layout aside a.active {
      background: var(--accent-soft);
      font-weight: 600;
    }

    .layout h4 {
      margin: 0 0 6px;
    }

    .result table td,
    .result table th {
      padding: 4px 8px;
      border-bottom: 1px solid var(--border);
    }

    .card {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .shadow {
      box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
    }

    .result ul,
    .result ol {
      margin: 8px 0;
      padding-left: 22px;
    }

    .result li {
      margin: 4px 0;
    }

    .result li button {
      margin-left: 6px;
      padding: 0 8px;
    }

    @media (max-width: 760px) {
      #layout {
        grid-template-columns: 1fr;
      }

      #nav {
        position: sticky;
        z-index: 10;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        padding: 8px 16px;
      }

      .toc {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        align-items: center;
      }

      .toc a {
        white-space: nowrap;
      }

      .toc-group {
        display: none;
      }

      .brand {
        font-size: 16px;
        padding: 0 8px 0 0;
      }

      .ver {
        display: none;
      }

      .lang {
        margin: 0 8px 0 0;
        flex: none;
      }

      #main {
        padding: 16px 16px 80px;
      }

      h1 {
        font-size: 30px;
      }

      pre.code,
      .result,
      .log {
        margin-left: 12px;
        margin-right: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="layout">
    <aside id="nav"></aside>
    <main id="main"></main>
  </div>

  <script src="src/juicy.js"></script>
  <script src="docs/i18n-en.js"></script>
  <script>
    /* ======================================================================
     * 每個範例的 code(el, log) 會「原樣」顯示在頁面上並實際執行：
     *   el  = 下方「結果」區塊   log = 輸出到 console 區塊
     *   回傳帶有 $unmount() 的物件（例如 vm）時，重新執行前會先呼叫它清理。
     *   頁面上的程式碼可直接編輯，按「↻ 重新執行」或 ⌘/Ctrl + Enter 執行修改後的版本。
     * ====================================================================== */
    const sections = [
      {
        id: 'install',
        group: '開始',
        title: '安裝與匯入',
        intro: '單一檔案，可以直接用 <code>&lt;script&gt;</code> 載入（建立全域 <code>$</code> 與 <code>juicy</code>），也可以用 ES module / CommonJS 匯入，並附有 TypeScript 型別。',
        api: [
          ['<script src="src/juicy.js"><\/script>', '直接在頁面載入，建立全域 <code>$</code> / <code>juicy</code>'],
          ["import $ from 'juicy'", "ES module（<code>dist/juicy.mjs</code>），不會建立全域變數；也可以具名匯入：<code>import { reactive, defineStore } from 'juicy'</code>"],
          ["const $ = require('juicy')", 'CommonJS（Node / 舊版打包工具）'],
          ['types/juicy.d.ts', 'TypeScript 型別：store 的 state / getters / actions、resource 的資料型別都能自動推斷'],
          ['npm run build', '由 <code>src/juicy.js</code> 產生 <code>dist/juicy.mjs</code>；<code>npm test</code> 會檢查兩者是否一致'],
        ],
        demos: [],
      },
      {
        id: 'create',
        group: '建立畫面',
        title: '建立元素 $()',
        intro: '<code>$()</code> 只會建立<strong>虛擬節點</strong>（純 JS 物件），所有鏈式操作都在記憶體中進行，直到 <code>mount()</code> 才一次產生真實 DOM。',
        api: [
          ["$('div')", '以標籤名建立元素'],
          ["$('div#id.a.b')", '選擇器語法同時設定 id 與 class'],
          ["$('<div>')", '可加上角括號，jQuery 習慣寫法'],
          ["$('#id') / $('.a')", '省略標籤時預設為 <code>div</code>'],
          ["$(chain)", '傳入既有的鏈式物件會原樣回傳'],
        ],
        demos: [
          {
            title: '各種建立方式',
            code(el, log) {
              $('div').append(
                $('div#box.card.shadow').text("$('div#box.card.shadow')"),
                $('<p>').text("$('<p>') 也可以"),
                $('.card').text("$('.card') 省略標籤 → div")
              ).mount(el);
              log(el.innerHTML);
            },
          },
          {
            title: 'mount() 之前不會碰真實 DOM',
            code(el, log) {
              const chain = $('p').text('我是虛擬節點').css({ color: 'teal' });
              log('mount 前 vnode.el =', chain.vnode.el);
              log('vnode =', JSON.stringify({ tag: chain.vnode.tag, style: chain.vnode.style }));
              chain.mount(el);
              log('mount 後 vnode.el =', chain.vnode.el.outerHTML);
            },
          },
        ],
      },
      {
        id: 'css',
        group: '建立畫面',
        title: '樣式 css()',
        api: [
          ['.css({ k: v, ... })', '一次設定多個樣式'],
          ['.css(name, value)', '設定單一樣式'],
          ['.css(name)', '讀取已設定的值（回傳值，之後不能再接鏈式呼叫）'],
        ],
        intro: '支援 camelCase、kebab-case 與 CSS 變數（<code>--x</code>）。數字會自動補 <code>px</code>，<code>opacity</code>、<code>zIndex</code>、<code>fontWeight</code>、<code>lineHeight</code>、<code>flex</code> 等無單位屬性除外。',
        demos: [
          {
            title: '設定樣式',
            code(el, log) {
              $('div').append(
                $('p').text('物件寫法').css({ color: '#FFCC00', background: '#333', padding: 8, fontWeight: 700 }),
                $('p').text('鍵值寫法').css('color', 'tomato'),
                $('p').text('kebab-case + CSS 變數').css({ '--c': 'teal', 'border-left': '4px solid var(--c)', paddingLeft: 8 }),
                $('p').text('數字自動補 px').css({ fontSize: 20, opacity: 0.6 })
              ).mount(el);
              log("讀取：", $('p').css({ color: 'red' }).css('color'));
            },
          },

    // 取出函式本體並去除縮排，讓顯示的程式碼與實際執行的完全一致
    function source(fn) {
      const s = fn.toString();
      const lines = s.slice(s.indexOf('{') + 1, s.lastIndexOf('}')).replace(/^\s*\n/, '').replace(/\s+$/, '').split('\n');
      const indent = Math.min(...lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
      return lines.map((l) => l.slice(indent)).join('\n');
    }

    function highlight(code) {
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const re = /(\/\/[^\n]*)|(`(?:\\[\s\S]|[^`\\])*`|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|\b(const|let|var|function|return|if|else|new|true|false|null|undefined|this|await|async)\b|\b(\d+(?:\.\d+)?)\b|(\$)(?=[.(])|\.([A-Za-z_]\w*)(?=\()/g;
      let out = '';
      let last = 0;
      let m;
      while ((m = re.exec(code))) {
        out += esc(code.slice(last, m.index));
        if (m[1]) out += `<span class="tk-c">${esc(m[1])}</span>`;
        else if (m[2]) out += `<span class="tk-s">${esc(m[2])}</span>`;
        else if (m[3]) out += `<span class="tk-k">${m[3]}</span>`;
        else if (m[4]) out += `<span class="tk-n">${m[4]}</span>`;
        else if (m[5]) out += '<span class="tk-d">$</span>';
        else out += `.<span class="tk-f">${m[6]}</span>`;
        last = re.lastIndex;
      }
      return out + esc(code.slice(last));
    }

    /* ---------- 文件本身的多語系（用 $.i18n） ----------
     * 介面文字用 key（ui.* / hero.*）；章節內容以「中文原文」當 key，英文翻譯在 docs/i18n-en.js。
     * 範例程式碼只翻譯其中的字串與註解，翻譯後的程式碼就是實際執行的程式碼。
     */
    const LANGS = { zh: { label: '中文', html: 'zh-Hant' }, en: { label: 'English', html: 'en' } };
    const LANG_KEY = 'juicy-doc-lang';
    const pickLang = () => {
      let l = null;
      try { l = new URLSearchParams(location.search).get('lang'); } catch (e) { /* 無網址 */ }
      if (!l) try { l = localStorage.getItem(LANG_KEY); } catch (e) { /* 無法讀取 */ }
      if (LANGS[l]) return l;

    const DOC_EN = window.JUICY_DOC_EN || { ui: {}, content: {}, code: {} };
    const doc = $.i18n({

    // 章節內容：中文原文當 key；中文模式找不到翻譯會直接回傳原文
    const t = (zh) => (zh == null ? zh : doc.t(zh));

    // 翻譯範例程式碼中的字串與註解（只換有中文的 token，程式結構不變）
    const CJK = /[\u3000-\u9fff\uff00-\uffef]/;
    function translateCode(code) {
      if (doc.locale === 'zh') return code;
      const dict = DOC_EN.code;
      const re = /(\/\/[^\n]*)|(`(?:\\[\s\S]|[^`\\])*`|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")/g;
      return code.replace(re, (m, comment, str) => {
        if (!CJK.test(m)) return m;
        if (comment) {
          const body = comment.replace(/^\/\/\s?/, '');
          return hasOwn(dict, body) ? '// ' + dict[body] : m;
        }
        const q = str[0];
        const inner = str.slice(1, -1);
        if (!hasOwn(dict, inner)) return m;
        // 翻譯內容若含同一種引號，自動跳脫
        return q + dict[inner].replace(new RegExp('(^|[^\\\\])' + q, 'g'), '$1\\' + q) + q;

    }
    const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

    const fmt = (v) =>
      typeof v === 'string' ? v : v === undefined ? 'undefined' : JSON.stringify(v);

    const demos = {};

    /* ---------- 可編輯的程式碼區塊：即時上色、Tab 縮排、Enter 自動縮排、⌘/Ctrl+Z 復原 ---------- */
    function selOffsets(root) {
      const sel = getSelection();
      if (!sel.rangeCount || !root.contains(sel.anchorNode)) return [0, 0];
      const at = (node, off) => {
        const r = document.createRange();
        r.selectNodeContents(root);
        r.setEnd(node, off);
        return r.toString().length;
      };
      const a = at(sel.anchorNode, sel.anchorOffset);
      const b = at(sel.focusNode, sel.focusOffset);
      return [Math.min(a, b), Math.max(a, b)];
    }
    function setCaret(root, offset) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = walker.nextNode())) {
        if (offset <= n.length) return getSelection().collapse(n, offset);
        offset -= n.length;
      }
      getSelection().collapse(root, root.childNodes.length);
    }

    function makeEditor(codeEl, { onRun, onChange } = {}) {
      const original = codeEl.textContent;
      let text = original;
      const undo = [];
      let redo = [];
      let lastSnap = 0;
      try { codeEl.contentEditable = 'plaintext-only'; } catch (e) { /* 舊瀏覽器不支援 */ }
      if (codeEl.contentEditable !== 'plaintext-only') codeEl.contentEditable = 'true';
      codeEl.spellcheck = false;
      codeEl.setAttribute('autocorrect', 'off');
      codeEl.setAttribute('autocapitalize', 'off');

      // 結尾多放一個換行，讓最後一行是空行時游標仍看得到
      const read = () => { const t = codeEl.textContent; return t.endsWith('\n') ? t.slice(0, -1) : t; };
      const paint = (caret) => {
        codeEl.innerHTML = highlight(text) + '\n';
        if (caret != null) setCaret(codeEl, caret);
        if (onChange) onChange(text !== original);
      };
      const snapshot = (force) => {
        const now = Date.now();
        if (force || now - lastSnap > 600) undo.push({ text, caret: selOffsets(codeEl)[0] });
        if (undo.length > 300) undo.shift();
        lastSnap = now;
        redo = [];
      };
      const splice = (start, end, ins, caret) => {
        snapshot(true);
        text = text.slice(0, start) + ins + text.slice(end);
        paint(caret != null ? caret : start + ins.length);
      };
      const history = (from, to) => {
        if (!from.length) return;
        to.push({ text, caret: selOffsets(codeEl)[0] });
        const st = from.pop();
        text = st.text;
        paint(st.caret);
      };
      const lineStart = (i) => text.lastIndexOf('\n', i - 1) + 1;

      codeEl.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        const mod = e.metaKey || e.ctrlKey;
        const [s, t] = selOffsets(codeEl);
        if (mod && e.key === 'Enter') {
          e.preventDefault();
          if (onRun) onRun();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const indent = text.slice(lineStart(s), s).match(/^ */)[0];
          splice(s, t, '\n' + indent);
        } else if (e.key === 'Tab' && !mod) {
          e.preventDefault();
          if (e.shiftKey) {
            const ls = lineStart(s);
            const n = text.slice(ls, ls + 2).match(/^ */)[0].length;
            if (n) splice(ls, ls + n, '', Math.max(ls, s - n));
          } else {
            splice(s, t, '  ');
          }
        } else if (mod && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          e.shiftKey ? history(redo, undo) : history(undo, redo);
        } else if (mod && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          history(redo, undo);
        } else if (e.key === 'Escape') {
          codeEl.blur();
        }

        const [s, t] = selOffsets(codeEl);

          e.inputType === 'historyUndo' ? history(undo, redo) : history(redo, undo);
        } else if (!e.isComposing) {
          snapshot(false);
        }
      });

        const caret = selOffsets(codeEl)[0];
        text = read();
        paint(caret);
      };
      codeEl.addEventListener('input', (e) => { if (!e.isComposing) sync(); }); // 中文輸入法組字中不重繪
      codeEl.addEventListener('compositionend', sync);

      return {
        original,
        get: () => text,
        reset() {
          snapshot(true);
          text = original;
          paint();
        },
      };
    }

    function runDemo(key) {
      if (cleanups[key]) {
        try { cleanups[key].$unmount(); } catch (e) { /* 已卸載 */ }
        cleanups[key] = null;
      }
      const el = document.getElementById('r-' + key);
      const logEl = document.getElementById('l-' + key);
      el.innerHTML = '';
      logEl.innerHTML = '';
      const log = (...args) => {
        const line = document.createElement('div');
        line.textContent = args.map(fmt).join(' ');
        logEl.appendChild(line);
      };
      try {
        // 顯示的程式碼和原始函式相同時直接執行原函式；否則（已編輯、或翻譯成英文）執行畫面上的程式碼
        const ed = editors[key];
        const run = !ed || ed.get() === source(demos[key].code) ? demos[key].code : new Function('el', 'log', ed.get());
        const r = run(el, log);
        if (r && typeof r.$unmount === 'function') cleanups[key] = r;
      } catch (e) {
        log('❌ ' + e.message);
      }
    }

    function demoCard(sec, d, i) {
      const key = `${sec.id}-${i}`;
      demos[key] = d;
      return $('div.demo').append(
        $('div.demo-head').append(
          $('h3').text(t(d.title)),
          $('div.actions').append(
            $('button.rerun.reset').t('ui.reset', null, doc).attr('title', doc.t('ui.resetTitle')).on('click', () => {
              editors[key].reset();
              runDemo(key);
            }),
            $('button.rerun').t('ui.rerun', null, doc).on('click', () => runDemo(key))
          )
        ),
        d.desc && $('p.desc').html(t(d.desc)),
        $('pre.code').attr('data-demo', key).append($('code').html(highlight(translateCode(source(d.code))))),
        $('div.result').id('r-' + key),
        $('div.log').id('l-' + key)
      );
    }

    const quickStart = `<script src="juicy.js"><\/script>
<div id="app"></div>
<script>
  $('div')
    .css({ color: '#FFCC00' })
    .append(
      $('a').text('123'),
      $('a').text('456'),
    )
    .mount('#app');
<\/script>`;

    const buildHero = () => $('section#start').append(
      $('h1').append('juicy', $('span').text('.js'), $('span').css({ paddingLeft: '20px', color: '#AAA', fontSize: '12px' }).text('claude x William77')),
      $('p.lead').t('hero.lead', null, doc),
      $('ul.features').append(
        ['chain', 'vdom', 'mvvm', 'component', 'router', 'store', 'resource', 'i18n'].map((k) =>
          $('li').append($('b').t(`hero.${k}.title`, null, doc), doc.t(`hero.${k}.desc`))
        )
      ),
      $('p.intro').html(doc.t('hero.intro')),
      $('pre.code.no-run').css({ margin: '12px 0' }).append($('code').html(highlight(quickStart)))
    );

    // 主內容：依目前語言建立；切換語言時整個重建並重新執行所有範例
    let io = null;
    function renderMain() {
      Object.keys(cleanups).forEach((key) => {
        try { cleanups[key] && cleanups[key].$unmount(); } catch (e) { /* 已卸載 */ }
        cleanups[key] = null;
      });
      Object.keys(editors).forEach((k) => delete editors[k]);

      $('div').append(
        buildHero(),
        sections.map((sec, i) =>
          $('section').id(sec.id).append(
            i > 0 && sec.group !== sections[i - 1].group && $('div.part').text(t(sec.group)), // 第一組接在首頁介紹後面，不另加標題
            $('h2').text(t(sec.title)),
            sec.intro && $('p.intro').html(t(sec.intro)),
            sec.api && $('table.api').append(
              $('tbody').each(sec.api, ([sig, desc]) =>
                $('tr').append($('td').append($('code').text(t(sig))), $('td').html(t(desc)))
              )
            ),
            sec.demos.map((d, i) => demoCard(sec, d, i))
          )
        )
      ).mount('#main');

      // 讓所有 pre.code 都可編輯；範例區塊的程式碼會在重新執行時使用
      document.querySelectorAll('pre.code > code').forEach((codeEl) => {
        const key = codeEl.parentNode.dataset.demo;
        const ed = makeEditor(codeEl, key && {
          onRun: () => runDemo(key),
          onChange: (edited) => codeEl.closest('.demo').classList.toggle('edited', edited),
        });
        if (key) editors[key] = ed;
      });
      // 點 pre 的留白處也能進入編輯
      document.querySelectorAll('pre.code').forEach((pre) =>
        pre.addEventListener('mousedown', (e) => {
          if (e.target === pre) {
            e.preventDefault();
            pre.firstChild.focus();
            setCaret(pre.firstChild, Infinity);
          }
        })
      );

      Object.keys(demos).forEach(runDemo);

      if (io) io.disconnect();
      if (typeof IntersectionObserver !== 'undefined') {
        io = new IntersectionObserver(
          (entries) => entries.forEach((e) => e.isIntersecting && (navState.active = e.target.id)),
          { rootMargin: '-10% 0px -80% 0px' }
        );
        document.querySelectorAll('#main section').forEach((s) => io.observe(s));
      }
    }

    // 側欄：響應式渲染（讀 doc.t()，切換語言時自動更新），捲動時自動標示目前章節
    const navState = $.reactive({ active: 'start' });
    $.render(() =>
      $('nav.toc').append(
        $('div.brand').append('juicy', $('span').text('.js')),
        $('div.ver').text(`v${$.version} ${doc.t('ui.apiDocs')}`),
        $('div.lang').append(
          Object.keys(LANGS).map((l) =>
            $('button').text(LANGS[l].label).addClass({ on: doc.locale === l }).attr('lang', LANGS[l].html)
              .on('click', () => setLang(l))
          )
        ),
        [{ id: 'start', title: 'ui.start', group: sections[0].group }, ...sections].map((s, i, list) => [
          // 每組的第一個章節前面加上分組標題
          s.group && s.group !== (list[i - 1] && list[i - 1].group) && $('div.toc-group').text(t(s.group)),
          $('a').attr('href', '#' + s.id).text(s.id === 'start' ? doc.t(s.title) : t(s.title))
            .addClass({ active: navState.active === s.id }),
        ])
      ), '#nav');

    function applyLang() {
      document.documentElement.lang = LANGS[doc.locale].html;
      document.title = doc.t('ui.title');
    }

    function setLang(l) {
      if (l === doc.locale) return;
      // 記住目前看到的章節，重建後捲回同一處
      const anchor = document.getElementById(navState.active);
      const offset = anchor ? anchor.getBoundingClientRect().top : 0;
      doc.locale = l;
      try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* 無法儲存 */ }
      try {
        const url = new URL(location.href);
        url.searchParams.set('lang', l);
        history.replaceState(null, '', url);
      } catch (e) { /* file:// 等環境 */ }
      applyLang();
      renderMain();
      const again = document.getElementById(navState.active);
      if (again) window.scrollBy(0, again.getBoundingClientRect().top - offset);
    }

    applyLang();
    renderMain();
  </script>
</body>

</html>
